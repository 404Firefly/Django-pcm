{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PCM Grogol{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'core/style.css' %}">

    <link rel="icon" type="image/webp" href="{% static 'images/logo.webp' %}">
</head>

<body>
    <!-- Loading page -->
    <div id="page-loading" class="page-loading" aria-hidden="true">
        <div class="loading-content">

            <div class="loading-logo">
                <img
                    src="{% static 'images/logo.webp' %}"
                    alt="Logo PCM Grogol"
                    width="84"
                    height="84"
                >
            </div>

            <p class="loading-title">Memuat halaman</p>
            <span class="loading-description">
                Mohon tunggu sebentar...
            </span>

        </div>
    </div>
    <div class="masthead">
        <div class="masthead-slides">
            <div class="masthead-slide is-active">
                <img
                    src="{% static 'images/nav1.webp' %}"
                    alt=""
                    loading="eager"
                    fetchpriority="high"
                    decoding="async"
                >
            </div>

            <div class="masthead-slide">
                <img
                    src="{% static 'images/nav2.webp' %}"
                    alt=""
                    loading="lazy"
                    decoding="async"
                >
            </div>

            <div class="masthead-slide">
                <img
                    src="{% static 'images/nav3.webp' %}"
                    alt=""
                    loading="lazy"
                    decoding="async"
                >
            </div>
        </div>
        {% include 'core/components/topbar.html' %}
        {% include 'core/components/navbar.html' %}
        {% block hero %}{% endblock %}
    </div>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include 'core/components/footer.html' %}

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="{% static 'core/main.js' %}" defer></script>
    <script src="{% static 'core/loading.js' %}" defer></script>

</body>
</html>
